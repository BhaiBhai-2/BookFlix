<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookflix</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap');

    :root {
      --bg: #141414;
      --red: #e50914;
      --red-hover: #f40612;
      --white: #f5f5f1;
      --muted: #b3b3b3;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--white);
      font-family: 'DM Sans', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Opening Splash Screen View */
    .welcome-hero {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at center, #1f1f1f 0%, #0a0a0a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 1000;
      transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .welcome-hero.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .welcome-content {
      max-width: 650px;
      padding: 0 24px;
    }

    .welcome-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(3.5rem, 9vw, 6rem);
      font-weight: 800;
      color: var(--red);
      letter-spacing: 3px;
      margin-bottom: 12px;
      text-shadow: 0 6px 30px rgba(229, 9, 20, 0.4);
    }

    .welcome-subtitle {
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.25rem);
      line-height: 1.5;
      margin-bottom: 36px;
    }

    /* "Read Now" Button Styling & Hover Effects */
    .read-now-btn {
      background-color: var(--red);
      color: #ffffff;
      border: none;
      padding: 18px 48px;
      font-size: 1.15rem;
      font-weight: 700;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(229, 9, 20, 0.4);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.5px;
    }

    .read-now-btn:hover {
      background-color: var(--red-hover);
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 35px rgba(229, 9, 20, 0.6);
    }

    .read-now-btn:active {
      transform: translateY(-1px) scale(0.99);
    }
        /* Active state to show the loader */
    .loading-box-overlay.active {
      opacity: 1;
      visibility: visible;
      transition: opacity 0s ease, visibility 0s 0s;
    }

    .spinning-box {
      width: 60px;
      height: 60px;
      background: #b20710;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      animation: spinBox 1s ease-in-out infinite;
    }

    @keyframes spinBox {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(1); }
    }

  </style>
</head>
<body>

  <!-- Opening / Landing Splash View -->
  <section class="welcome-hero" id="welcomeScreen">
    <div class="welcome-content">
      <h1 class="welcome-title">BOOKFLIX</h1>
      <p class="welcome-subtitle">Your cinematic gateway to classic literature and timeless stories.</p>
      <button id="readNowBtn" class="read-now-btn" type="button" onclick="triggerLoader()">Get Started</button>
    </div>
  </section>

  <!-- Script to transition smoothly and redirect to main.html -->
  <script>
    document.getElementById("readNowBtn").addEventListener("click", function() {
      const welcomeScreen = document.getElementById("welcomeScreen");
      
      // Trigger fade out effect
      welcomeScreen.classList.add("hidden");
      
      // Navigate to main.html after a brief delay matching the fade animation (600ms)
      setTimeout(() => {
        window.location.href = "payment.html";
      }, 600);
    });

function triggerLoader() {
  const loader = document.getElementById("loadingBox");

  // 1. Show the spinning box overlay
  loader.classList.add("active");

  // 2. Keep it spinning for 2 seconds (2000 milliseconds)
  setTimeout(() => {
    
    // --- PUT YOUR WEBPAGE SWITCHING CODE HERE ---
    // Example: 
    // window.location.hash = "#reader"; 
    // or switchView("reader");
    console.log("Webpage switched!");
    // --------------------------------------------

    // 3. Hide the loading box
    loader.classList.remove("active");
  }, 2000);
}
  </script>

</body>
</html>
